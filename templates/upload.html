<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#0d1b2a; color:white; padding:50px;">
<div class="container" style="max-width:400px;">
    <h3>Upload Document</h3>
    <form method="POST" enctype="multipart/form-data">
        <input type="text" name="title" class="form-control mb-3" placeholder="Document Title" required>
        <input type="text" name="doc_type" class="form-control mb-3" placeholder="Document Type" required>
        <input type="file" name="file" class="form-control mb-3" required>
        <button type="submit" class="btn btn-success w-100">Upload</button>
    </form>
</div>
</body>
