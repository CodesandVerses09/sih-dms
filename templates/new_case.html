<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#0d1b2a; color:white; padding:50px;">
<div class="container" style="max-width:400px;">
    <h3>Create New Case</h3>
    <form method="POST">
        <input type="text" name="title" class="form-control mb-3" placeholder="Case Title" required>
        <input type="text" name="number" class="form-control mb-3" placeholder="Case Number" required>
        <button type="submit" class="btn btn-primary w-100">Create Case</button>
    </form>
</div>
</body>
