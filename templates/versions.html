<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#0d1b2a; color:white; padding:30px;">
<div class="container">
    <h3>Versions of {{ doc.title }}</h3>
    <ul class="list-group">
    {% for v in versions %}
        <li class="list-group-item bg-dark text-white">Version {{ v.version_number }} — {{ v.uploaded_at }} — Hash: {{ v.file_hash[:16] }}...</li>
    {% endfor %}
    </ul>
</div>
</body>
