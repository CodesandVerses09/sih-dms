<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#0d1b2a; color:white; padding:30px;">
<div class="container">
    <h3>Audit Log</h3>
    <table class="table table-dark table-striped">
    <tr><th>User</th><th>Action</th><th>Document</th><th>Case</th><th>Time</th></tr>
    {% for log in logs %}
    <tr><td>{{ log.user_id }}</td><td>{{ log.action }}</td><td>{{ log.document_id }}</td><td>{{ log.case_id }}</td><td>{{ log.timestamp }}</td></tr>
    {% endfor %}
    </table>
</div>
</body>
