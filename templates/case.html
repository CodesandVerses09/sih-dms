<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#0d1b2a; color:white; padding:30px;">
<div class="container">
    <h2>{{ case.case_title }}</h2>
    <a href="{{ url_for('upload_document', case_id=case.id) }}" class="btn btn-success btn-sm mb-3">+ Upload Document</a>
    <ul class="list-group">
    {% for doc in documents %}
        <li class="list-group-item bg-dark text-white">
            {% if doc.is_redacted %}
                <span class="badge bg-danger">[REDACTED]</span>
            {% else %}
                {{ doc.title }} ({{ doc.document_type }})
            {% endif %}
            <a href="{{ url_for('view_versions', doc_id=doc.id) }}" class="btn btn-sm btn-outline-info">Versions</a>
            <a href="{{ url_for('new_version', doc_id=doc.id) }}" class="btn btn-sm btn-outline-warning">New Version</a>
            <a href="{{ url_for('toggle_redact', doc_id=doc.id) }}" class="btn btn-sm btn-outline-danger">Toggle Redaction</a>
        </li>
    {% endfor %}
    </ul>
    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary mt-3">Back to Dashboard</a>
</div>
</body>
