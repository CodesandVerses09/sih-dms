<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#0d1b2a; color:white; padding:50px;">
<div class="container">
    <form method="GET" class="d-flex mb-4">
        <input type="text" name="q" class="form-control me-2" placeholder="Search documents..." value="{{ query }}">
        <button type="submit" class="btn btn-primary">Search</button>
    </form>
    <ul class="list-group">
    {% for doc in results %}
        <li class="list-group-item bg-dark text-white">{{ doc.title }} ({{ doc.document_type }})</li>
    {% endfor %}
    </ul>
</div>
</body>
